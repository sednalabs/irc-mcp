[workspace]
resolver = "2"
members = [".", "upstream/mcp-toolkit-resource-state"]

[package]
name = "irc-mcp"
version = "0.2.0"
edition = "2021"
rust-version = "1.99"
publish = false
license = "Apache-2.0"
description = "Hosted, authenticated IRC MCP adapter for a private WeeChat Relay"

[dependencies]
axum = "0.8.9"
base64 = "0.22"
bytes = "1"
futures-util = { version = "0.3", features = ["sink"] }
http = "1.3.1"
http-body-util = "0.1.3"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
mcp-toolkit = { git = "https://github.com/sednalabs/mcp-toolkit-rs", rev = "62e1add3eccadc191c5f7791bce4d2be1a8380a3", features = ["server-auth"] }
mcp-toolkit-auth = { git = "https://github.com/sednalabs/mcp-toolkit-rs", rev = "62e1add3eccadc191c5f7791bce4d2be1a8380a3" }
mcp-toolkit-resource-state = { path = "upstream/mcp-toolkit-resource-state" }
percent-encoding = "2"
semver = "1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1.52.3", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time", "fs", "io-util"] }
tokio-tungstenite = "0.28"
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.9"
uuid = { version = "1", features = ["v4"] }
url = "2"
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }

# Patch tables are not inherited from Git dependencies. Keep these at the root.
[patch.crates-io]
rmcp = { git = "https://github.com/sednalabs/rust-sdk", rev = "1d2e6ffdaccc7711552154dd2c9d7af4913a8f1e" }
rmcp-macros = { git = "https://github.com/sednalabs/rust-sdk", rev = "1d2e6ffdaccc7711552154dd2c9d7af4913a8f1e" }
