# Public-safe, manually-triggerable and PR-triggered source qualification.
# This workflow does not access deployment secrets, IRC, or private runners.
name: Qualify IRC MCP candidate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: irc-mcp-qualify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out unprivileged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 (full commit SHA)
        with:
          persist-credentials: false
      - name: Verify toolchain and source lockfile
        shell: bash
        run: |
          set -euo pipefail
          test -f Cargo.lock || { echo 'Missing reviewed Cargo.lock: prepare and commit it before CI can pass.' >&2; exit 1; }
          git ls-files --error-unmatch Cargo.lock
          rustc --version
          cargo --version
          python3 --version
      - name: Prepare isolated Python validation environment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements-validation.txt
      - name: Check artifact contracts
        shell: bash
        run: .venv/bin/python -m pytest -q tests/test_artifact_contracts.py
      - name: Compile, test, and lint candidate (no deployment)
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo check --workspace --all-targets --locked
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Verify generated files are unchanged
        shell: bash
        run: git diff --exit-code
